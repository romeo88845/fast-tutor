<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast-Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════
   M3 DESIGN TOKENS
   ════════════════════════════════════════════════ */
:root {
  --primary: #1A6ABF; --on-primary: #FFFFFF; --primary-container: #D1E4FF; --on-primary-container: #001D36;
  --secondary: #565F71; --on-secondary: #FFFFFF; --secondary-container: #DAE2F9;
  --surface: #FDFCFF; --on-surface: #1A1C1E;
  --surface-variant: #E0E2EC; --on-surface-variant: #43474E;
  --outline: #74777F; --outline-variant: #C4C6D0;
  --error: #BA1A1A; --error-container: #FFDAD6;
  --success: #2E7D32; --success-container: #E8F5E9;
  --elevation-0: none;
  --elevation-1: 0 1px 3px 1px rgba(0,0,0,0.15),0 1px 2px 0 rgba(0,0,0,0.30);
  --elevation-2: 0 2px 6px 2px rgba(0,0,0,0.15),0 1px 2px 0 rgba(0,0,0,0.30);
  --elevation-3: 0 4px 8px 3px rgba(0,0,0,0.15),0 1px 3px 0 rgba(0,0,0,0.30);
  --shape-none: 0; --shape-sm: 4px; --shape-md: 8px; --shape-lg: 12px; --shape-xl: 16px; --shape-full: 999px;
  --font: 'Roboto Flex', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font:400 14px/20px var(--font);color:var(--on-surface);background:var(--surface);-webkit-font-smoothing:antialiased;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── Top App Bar (elevated) ── */
.top-bar{height:64px;display:flex;align-items:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--outline-variant);flex-shrink:0;gap:8px;z-index:100}
.top-bar .tb-left{display:flex;align-items:center;gap:4px}
.top-bar .tb-center{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.top-bar .tb-right{display:flex;align-items:center}
.mode-tab{display:flex;align-items:center;gap:4px;padding:6px 10px;font:500 12px/16px var(--font);color:var(--on-surface-variant);background:none;border:none;border-radius:var(--shape-md);cursor:pointer;transition:all .12s;white-space:nowrap}
.mode-tab:hover{background:var(--surface-variant)}
.mode-tab.active{background:var(--primary-container);color:var(--on-primary-container)}
.mode-tab .mat-icon{font-family:'Material Symbols Outlined';font-size:16px}
.top-bar .menu-btn{display:none;font-family:'Material Symbols Outlined';font-size:24px;cursor:pointer;padding:8px;border-radius:var(--shape-full);border:none;background:none;color:var(--on-surface)}
.top-bar .menu-btn:hover{background:var(--surface-variant)}
.top-bar h1{font:500 22px/28px var(--font);flex:1}
.top-bar .streak{display:flex;align-items:center;gap:4px;font:500 12px/16px var(--font);color:var(--primary);background:var(--primary-container);padding:4px 12px;border-radius:var(--shape-full);cursor:default}

/* ── Layout ── */
.app-wrapper{display:flex;flex:1;overflow:hidden}

/* ── Navigation Drawer (desktop) ── */
.panel{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--outline-variant);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.panel-header{display:flex;align-items:center;gap:4px;padding:10px 8px;border-bottom:1px solid var(--outline-variant)}
.panel .bar{height:4px;background:var(--surface-variant);margin:0;overflow:hidden}
.panel .bar .fill{height:100%;background:var(--primary);transition:width .3s}
.lesson-tree{padding:4px 0;flex:1;overflow-y:auto}
.domain-group{margin:0 4px}
.domain-group .dg-header{display:flex;align-items:center;gap:6px;padding:6px 12px;font:500 12px/16px var(--font);color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:var(--shape-sm);transition:background .12s}
.domain-group .dg-header:hover{background:var(--surface-variant)}
.domain-group .dg-header .arrow{font-size:14px;transition:transform .15s}
.domain-group .dg-header .arrow.open{transform:rotate(90deg)}
.domain-group .dg-lessons{overflow:hidden;max-height:0;transition:max-height .2s}
.domain-group .dg-lessons.open{max-height:2000px}
.lesson-item{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 28px;border-radius:var(--shape-sm);cursor:pointer;transition:background .12s;font:400 13px/18px var(--font)}
.lesson-item:hover{background:var(--surface-variant)}
.lesson-item.active{background:var(--primary-container)}
.lesson-item .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 10px/12px var(--font);flex-shrink:0;background:var(--surface-variant);color:var(--on-surface-variant)}
.lesson-item.active .num{background:var(--primary);color:var(--on-primary)}
.lesson-item .num.done{background:var(--success);color:#fff}
.lesson-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Main Content ── */
.main{flex:1;overflow-y:auto;padding:32px;display:flex;justify-content:center}
.main-inner{max-width:720px;width:100%}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--shape-lg);padding:24px;margin-bottom:16px;box-shadow:var(--elevation-1)}
.card.teach{border-left:4px solid var(--primary);background:var(--primary-container);border-color:var(--primary);box-shadow:var(--elevation-2)}
.card .step-badge{font:500 11px/16px var(--font);color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.card.teach .step-badge{color:var(--on-primary-container)}
.card h2{font:500 20px/28px var(--font);margin-bottom:8px}
.card.teach .meta{font:400 13px/18px var(--font);color:var(--on-primary-container);opacity:.8;margin-bottom:12px}
.card .body{font:400 15px/22px var(--font);line-height:1.6;margin-bottom:12px}
.card.teach .body{color:var(--on-primary-container)}
.card .segment{background:var(--surface);border-radius:var(--shape-md);padding:12px 16px;margin-bottom:8px;border:1px solid var(--outline-variant)}
.card .segment .st{font:400 11px/16px var(--font);color:var(--on-surface-variant);margin-bottom:4px}

/* ── Questions ── */
.question{font:500 17px/24px var(--font);margin-bottom:16px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--outline);border-radius:var(--shape-md);cursor:pointer;transition:all .12s;font:400 15px/22px var(--font)}
.choice:hover{border-color:var(--primary);background:var(--primary-container)}
.choice .lt{width:24px;height:24px;border-radius:50%;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;font:500 12px/16px var(--font);color:var(--on-surface-variant);flex-shrink:0;transition:all .12s}
.choice:hover .lt{background:var(--primary);color:var(--on-primary)}
.choice.selected{border-color:var(--primary);background:var(--primary-container)}
.choice.selected .lt{background:var(--primary);color:var(--on-primary)}
.choice.correct{border-color:var(--success);background:var(--success-container)}
.choice.correct .lt{background:var(--success);color:#fff}
.choice.wrong{border-color:var(--error);background:var(--error-container)}
.choice.wrong .lt{background:var(--error);color:#fff}

/* ── Feedback ── */
.feedback{display:none;margin-top:12px;padding:16px 20px;border-radius:var(--shape-md);font:400 14px/20px var(--font)}
.feedback.show{display:block}
.feedback.correct{background:var(--success-container);color:var(--success)}
.feedback.wrong{background:var(--error-container);color:var(--error)}
.feedback .fb-title{font:500 14px/20px var(--font);margin-bottom:4px}
.feedback .fb-body{opacity:.9}

/* ── Buttons ── */
.btn-group{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 24px;border:none;border-radius:var(--shape-full);font:500 14px/20px var(--font);cursor:pointer;transition:all .12s;text-decoration:none}
.btn-fill{background:var(--primary);color:var(--on-primary);box-shadow:var(--elevation-1)}
.btn-fill:hover{box-shadow:var(--elevation-2)}
.btn-outline{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.btn-outline:hover{background:var(--primary-container)}
.btn-text{background:transparent;color:var(--primary);padding:0 16px}
.btn-text:hover{background:var(--primary-container)}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.btn .icon{font-family:'Material Symbols Outlined';font-size:18px}

/* ── Welcome ── */
.welcome{text-align:center;padding:60px 20px}
.welcome .icon{font-family:'Material Symbols Outlined';font-size:64px;color:var(--primary);margin-bottom:12px}
.welcome h2{font:500 28px/36px var(--font);margin-bottom:8px}
.welcome p{font:400 16px/24px var(--font);color:var(--on-surface-variant);max-width:400px;margin:0 auto 24px}

/* ── Session end ── */
.r-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;text-align:center;margin:16px 0}
.r-grid .num{font:400 32px/40px var(--font);color:var(--primary);font-weight:500}
.r-grid .lbl{font:400 12px/16px var(--font);color:var(--on-surface-variant);margin-top:2px}

/* ── Loading state ── */
.loading{text-align:center;padding:60px;color:var(--on-surface-variant)}
.loading .spinner{font-family:'Material Symbols Outlined';font-size:32px;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── Bottom Navigation (mobile) ── */
.bottom-nav{display:none;height:64px;background:var(--surface);border-top:1px solid var(--outline-variant);flex-shrink:0;z-index:100}
.bottom-nav .nv-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--on-surface-variant);font:500 11px/16px var(--font);transition:color .12s}
.bottom-nav .nv-item.active{color:var(--primary)}
.bottom-nav .nv-item .icon{font-family:'Material Symbols Outlined';font-size:24px}

/* ── Mobile drawer overlay ── */
/* panel now handles mobile via class */


.panel.show{display:flex;position:fixed;top:48px;left:0;bottom:0;z-index:100;box-shadow:var(--elevation-3);animation:slideIn .2s ease}

/* ── M3 Dialog ── */
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center}
.dialog-overlay.show{display:flex}
.dialog{background:var(--surface);border-radius:var(--shape-xl);padding:24px;max-width:400px;width:90%;box-shadow:var(--elevation-3)}
.dialog h3{font:500 18px/24px var(--font);margin-bottom:8px}
.dialog p{font:400 14px/20px var(--font);color:var(--on-surface-variant);margin-bottom:20px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--outline-variant);border-radius:var(--shape-sm)}

/* ════════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
   ════════════════════════════════════════════════ */
@media(max-width:840px){
  .drawer{display:none}
  .top-bar .menu-btn{display:block}
  .bottom-nav{display:flex}
  .main{padding:16px}
}
@media(max-width:600px){
  .main{padding:12px}
  .card{padding:16px}
  .r-grid{grid-template-columns:1fr 1fr}
  .welcome{padding:40px 16px}
}
</style>
</head>
<body>

<!-- Top App Bar -->
<header class="top-bar">
  <button class="menu-btn" id="menuBtn" onclick="toggleMobileDrawer()">menu</button>
  <select id="examSelector" onchange="switchExam(this.value)" style="font:500 13px/18px var(--font);background:var(--surface-variant);border:none;border-radius:var(--shape-md);padding:4px 8px;color:var(--on-surface);max-width:160px;cursor:pointer;margin-left:4px"></select>
  <h1>Fast-Tutor</h1>
  <span class="streak" id="streakBadge"><span class="icon" style="font-family:'Material Symbols Outlined';font-size:16px">local_fire_department</span><span id="streakNum">0</span></span>
</header>

<div class="app-wrapper">
  <!-- Navigation Drawer (desktop) -->
  <aside class="drawer" id="navDrawer">
    <div class="section">Course</div>
    <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    <div id="lessonList"></div>
    <div class="section" style="margin-top:12px">Progress</div>
    <div class="stats" id="stats">
      <div class="row"><span>Streak</span><strong id="statStreak">0</strong></div>
      <div class="row"><span>Completed</span><strong id="statDone">0</strong></div>
      <div class="row"><span>Accuracy</span><strong id="statAcc">0%</strong></div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <div class="main-inner" id="contentArea">
      <div class="welcome">
        <div class="icon">school</div>
        <h2>Fast-Tutor</h2>
        <p>Learn Microsoft technologies through micro-lessons and adaptive quizzing.</p>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
          <p style="font:400 14px/20px var(--font);color:var(--on-surface-variant);max-width:360px;margin-bottom:8px;text-align:center">Pick a mode from the top bar to start learning, or import new content.</p>
          <button class="btn btn-text" onclick="showUploadForm()" style="width:220px;justify-content:center">
            <span class="mat-icon" style="font-family:'Material Symbols Outlined';font-size:18px">upload_file</span> Upload PDF / EPUB
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Bottom Navigation (mobile) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nv-item active" data-tab="learn" onclick="switchTab('learn')"><span class="icon">school</span>Learn</button>
  <button class="nv-item" data-tab="progress" onclick="switchTab('progress')"><span class="icon">bar_chart</span>Progress</button>
  <button class="nv-item" data-tab="queue" onclick="switchTab('queue')"><span class="icon">format_list_bulleted</span>Queue</button>
</nav>

<!-- Mobile Drawer Overlay -->
<div class="drawer-overlay" id="mobileDrawer" onclick="closeMobileDrawer(event)">
  <div class="drawer-mobile" id="drawerMobileInner">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px 4px">
        <div class="section" style="padding:0">Course</div>
        <button class="menu-btn" onclick="closeDrawer()" style="font-size:15px;padding:2px" aria-label="Close">close</button>
      </div>
    <div class="bar"><div class="fill" id="mProgressFill" style="width:0%"></div></div>
    <div id="mLessonList"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════ */
const API = '';
let sessionId = null;
let currentStep = null;
let totalSteps = 0;
let answered = false;
let streak = parseInt(localStorage.getItem('ft-streak') || '0');
let completed = parseInt(localStorage.getItem('ft-completed') || '0');
let sessionCorrect = 0;
let sessionTotal = 0;
let lessons = [];

/* ════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════ */
async function loadCourse(examId) {
  window.examId = examId;
  localStorage.setItem('ft-exam', examId);
  try {
    const r = await fetch(API + '/api/exams/' + examId + '/lessons');
    lessons = await r.json();
  } catch(e) { lessons = []; }
  try {
    const cr = await fetch(API + '/api/progress/1/completed-lessons?exam_id=' + examId);
    const cd = await cr.json();
    window.completedLessons = cd.completed_ids || [];
  } catch(e) { window.completedLessons = []; }
  renderLessonList();
  updateStats();
}

async function switchExam(id) {
  localStorage.removeItem('ft-session');
  await loadCourse(id);
  document.getElementById('contentArea').innerHTML = document.querySelector('.welcome') ? document.querySelector('.welcome').outerHTML : '<div class="welcome"><div class="icon">school</div><h2>Fast-Tutor</h2><p>Course loaded.</p></div>';
}

async function init() {
  try {
    const er = await fetch(API + '/api/exams');
    const exams = await er.json();
    var sel = document.getElementById('examSelector');
    if (sel) {
      exams.forEach(function(e) {
        var opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.name || e.code;
        sel.appendChild(opt);
      });
    }
    window.examId = parseInt(localStorage.getItem('ft-exam') || '1');
    if (sel) sel.value = window.examId;
  } catch(e) { window.examId = 1; }
  await loadCourse(window.examId);
  checkResume();
  return;
  // Old init below
  try {
    const r = await fetch(API + '/api/exams/1/lessons');
    lessons = await r.json();
    renderLessonList();
  } catch(e) {
    console.error('Failed to load lessons', e);
  }
  updateStats();
  // Check for resumable session
  checkResume();
}

async function checkResume() {
  const sid = localStorage.getItem('ft-session');
  if (!sid) return;
  try {
    const r = await fetch(API + '/api/sessions/' + sid + '/step');
    const data = await r.json();
    const step = data.step || {};
    if (step.step_type && step.step_type !== 'complete') {
      const area = document.getElementById('contentArea');
      area.innerHTML = '<div class="card" style="text-align:center;padding:24px">' +
        '<div style="font:500 18px/24px var(--font);margin-bottom:8px">⏰ Session in Progress</div>' +
        '<p style="font:400 14px/20px var(--font);color:var(--on-surface-variant);margin-bottom:16px">You were on: ' + esc(step.tutor_message || 'a lesson') + '</p>' +
        '<div class="btn-group" style="justify-content:center">' +
        '<button class="btn btn-fill" onclick="resumeSession(' + sid + ')">Resume</button>' +
        '<button class="btn btn-text" onclick="clearResume()">Start Fresh</button></div></div>';
    }
  } catch(e) {}
}

async function resumeSession(sid) {
  sessionId = sid;
  localStorage.setItem('ft-session', sid);
  try {
    const r = await fetch(API + '/api/sessions/' + sid + '/step');
    const data = await r.json();
    const step = data.step || {};
    if (step.id) {
      renderStep(step);
    } else {
      startSession('learn');
    }
  } catch(e) {
    startSession('learn');
  }
}

function clearResume() {
  localStorage.removeItem('ft-session');
  location.reload();
}

function renderLessonList() {
  const list = document.getElementById('lessonTree');
  const mList = document.getElementById('lessonTree');
  var completed = window.completedLessons || [];
  const html = lessons.map((l, i) => {
    var done = completed.indexOf(l.id) >= 0;
    return '<div class="lesson' + (currentStep && currentStep.lesson_id === l.id ? ' active' : '') + '" data-id="' + l.id + '" onclick="closePanel();selectLesson(' + l.id + ')">' +
      '<span class="num" style="' + (done ? 'background:var(--success);color:#fff' : '') + '">' + (done ? '\u2713' : (i + 1)) + '</span>' +
      '<span class="t">' + esc(l.title) + '</span></div>';
  }).join('');
  // removed '<div style="padding:12px;font:400 13px/18px var(--font);color:var(--on-surface-variant)">No lessons loaded.</div>';
}

/* ════════════════════════════════════════════════
   SESSION LOOP
   ════════════════════════════════════════════════ */
async function startSession(mode) {
  mode = mode || 'learn';
  sessionCorrect = 0;
  sessionTotal = 0;
  document.getElementById('contentArea').innerHTML = '<div class="loading"><div class="spinner">autorenew</div><p style="margin-top:12px">Starting ' + mode + ' session...</p></div>';
  
  try {
    const r = await fetch(API + '/api/sessions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({exam_id: window.examId, mode: mode, user_id: 1})
    });
    const data = await r.json();
    sessionId = data.session_id;
    localStorage.setItem('ft-session', sessionId);
    if (data.current_step) {
      currentStep = data.current_step.step;
      totalSteps = data.current_step.total_steps;
      renderStep(currentStep);
    }
  } catch(e) {
    showError('Failed to start session');
  }
}

async function submitAnswer(stepId, response) {
  if (answered) return;
  answered = true;
  sessionTotal++;

  try {
    const r = await fetch(API + `/api/sessions/${sessionId}/step`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, step_id: stepId, response: response})
    });
    const data = await r.json();
    
    // Mark choices
    if (data.correct) {
      sessionCorrect++;
      streak++;
      localStorage.setItem('ft-streak', streak);
      document.querySelectorAll('.choice').forEach(c => {
        if (c.dataset.label === response) c.classList.add('correct');
      });
    } else {
      streak = 0;
      localStorage.setItem('ft-streak', streak);
      document.querySelectorAll('.choice').forEach(c => {
        const correctLabels = currentStep.question.options.filter(o => o.is_correct !== false && o.is_correct !== undefined).map(o => o.label);
        // Actually the API returns which was correct, we need to mark based on the question's options
      });
    }

    // Show feedback
    const fb = document.getElementById('feedback');
    const fbDiv = document.getElementById('feedbackDiv');
    fbDiv.className = 'feedback show ' + (data.correct ? 'correct' : 'wrong');
    fbDiv.innerHTML = `<div class="fb-title">${data.correct ? '\u2705 Correct' : '\u274c Not quite'}</div><div class="fb-body">${esc(data.explanation || '')}</div>`;
    
    updateStreak();
    updateStats();

    // Show next/continue buttons
    if (data.next_step) {
      currentStep = data.next_step.step;
      totalSteps = data.next_step.total_steps;
      document.getElementById('nextGroup').style.display = 'flex';
      document.getElementById('nextBtn').onclick = () => renderStep(currentStep);
    } else {
      // Session complete
      document.getElementById('nextGroup').style.display = 'flex';
      document.getElementById('nextBtn').textContent = 'See Results';
      document.getElementById('nextBtn').onclick = showSessionEnd;
    }
  } catch(e) {
    showError('Failed to submit answer');
  }
}

function renderStep(step) {
  answered = false;
  const area = document.getElementById('contentArea');
  
  if (step.step_type === 'teach' || step.step_type === 'prediction') {
    const segments = step.lesson && step.lesson.segments ? step.lesson.segments : [];
    area.innerHTML = `
      <div class="card teach">
        <div class="step-badge">${step.step_type === 'prediction' ? 'Think about it' : 'Learn'}</div>
        <h2>${esc(step.lesson ? step.lesson.title : 'Lesson')}</h2>
        <div class="body">${esc(step.lesson ? step.lesson.content_md : '')}</div>
        ${segments.map(s => `
          <div class="segment">
            <div class="st">${s.time_start ? 'Video @' + s.time_start : ''}</div>
            <div>${esc((s.content_md || '').slice(0, 300))}${(s.content_md || '').length > 300 ? '...' : ''}</div>
          </div>
        `).join('')}
      </div>
      <div class="btn-group">
        <button class="btn btn-fill" onclick="advanceStep(${step.id})">Continue \u2192</button>
      </div>`;
    renderLessonList();
    
  } else if (step.step_type === 'question') {
    const q = step.question;
    if (!q) {
      area.innerHTML = '<div class="card"><p>No question available.</p></div>';
      return;
    }
    area.innerHTML = `
      <div class="card">
        <div class="step-badge">Question</div>
        <div class="question">${esc(q.stem)}</div>
        <div class="choices" id="choicesContainer">
          ${q.options.map((o, i) =>
            `<div class="choice" data-label="${o.label}" onclick="selectChoice('${o.label}', ${step.id})">
              <span class="lt">${o.label}</span>${esc(o.text)}
            </div>`
          ).join('')}
        </div>
        <div class="feedback" id="feedbackDiv"></div>
      </div>
      <div class="btn-group" id="nextGroup" style="display:none">
        <button class="btn btn-fill" id="nextBtn">Continue \u2192</button>
      </div>`;
    
  } else if (step.step_type === 'feedback') {
    // Feedback is already shown inline with the question, advance
    advanceStep(step.id);
    
  } else if (step.step_type === 'complete') {
    showSessionEnd();
  }
  
  // Scroll to top
  document.getElementById('mainContent').scrollTop = 0;
  updateStats();
}

function selectChoice(label, stepId) {
  if (answered) return;
  document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.choice[data-label="${label}"]`).classList.add('selected');
  submitAnswer(stepId, JSON.stringify(label));
}

function advanceStep(stepId) {
  // Send empty response to advance past non-question steps
  fetch(API + `/api/sessions/${sessionId}/step`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, step_id: stepId, response: '""'})
  })
  .then(r => r.json())
  .then(data => {
    if (data.next_step) {
      currentStep = data.next_step.step;
      totalSteps = data.next_step.total_steps;
      renderStep(currentStep);
    } else if (data.session_complete) {
      showSessionEnd();
    } else {
      // Get next step
      fetch(API + `/api/sessions/${sessionId}/step`)
        .then(r => r.json())
        .then(stepData => {
          currentStep = stepData.step;
          renderStep(currentStep);
        });
    }
  })
  .catch(e => showError('Failed to advance'));
}

function showSessionEnd() {
  completed++;
  localStorage.setItem('ft-completed', completed);
  const acc = sessionTotal ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;
  document.getElementById('contentArea').innerHTML = `
    <div class="card" style="text-align:center;padding:32px">
      <div style="font:500 24px/32px var(--font);margin-bottom:16px">Session Complete!</div>
      <div class="r-grid">
        <div><div class="num">${sessionTotal}</div><div class="lbl">Questions</div></div>
        <div><div class="num">${sessionCorrect}</div><div class="lbl">Correct</div></div>
        <div><div class="num" style="color:${acc >= 80 ? 'var(--success)' : acc >= 50 ? '#F9A825' : 'var(--error)'}">${acc}%</div><div class="lbl">Accuracy</div></div>
      </div>
      <div class="btn-group" style="justify-content:center">
        <button class="btn btn-fill" onclick="localStorage.removeItem('ft-session'); location.reload()">Back to Menu</button>
        <button class="btn btn-outline" onclick="location.reload()">Back to Home</button>
      </div>
    </div>`;
  updateStats();
}

/* ════════════════════════════════════════════════
   UI UPDATES
   ════════════════════════════════════════════════ */
function updateStreak() {
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('statStreak').textContent = streak;
}

function updateStats() {
  updateStreak();
  document.getElementById('statDone').textContent = completed;
  document.getElementById('statAcc').textContent = sessionTotal ? Math.round((sessionCorrect / sessionTotal) * 100) + '%' : '0%';
  const pct = lessons.length ? Math.min(100, Math.round((completed / lessons.length) * 100)) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('mProgressFill').style.width = pct + '%';
}

/* ════════════════════════════════════════════════
   NAVIGATION
   ════════════════════════════════════════════════ */
function togglePanel() {
  document.getElementById('lessonPanel').classList.toggle('show');
}

function selectLesson(id) {
  var l = lessons.find(function(x) { return x.id === id; });
  if (!l) return;
  var segs = l.segments || [];
  var qs = l.questions || [];
  
  var segHtml = segs.map(function(s) {
    var txt = s.content_md || s.text || '';
    var tm = s.time_start || s.time || '';
    return '<div class="card card-outline" style="margin-bottom:8px">' +
      (tm ? '<div style="font:500 11px/14px var(--font);color:var(--primary);margin-bottom:6px">' + esc(tm) + '</div>' : '') +
      '<p style="font:400 14px/20px var(--font);white-space:pre-wrap">' + esc(txt) + '</p></div>';
  }).join('');
  
  var qHtml = qs.map(function(q) {
    var opts = (q.options || []).map(function(o) {
      return '<div class="choice" style="padding:8px 12px;margin:4px 0;border:1px solid var(--outline);border-radius:var(--shape-md);font:400 14px/20px var(--font);cursor:default">' +
        esc(o.label) + '. ' + esc(o.text) + '</div>';
    }).join('');
    return '<div class="card card-outline" style="margin-bottom:8px">' +
      '<div style="font:500 14px/20px var(--font);margin-bottom:8px">' + esc(q.stem || '') + '</div>' +
      opts + '</div>';
  }).join('');
  
  var area = document.getElementById('contentArea');
  area.innerHTML = '<div style="max-width:720px;margin:0 auto">' +
    '<div class="card card-elevated" style="margin-bottom:16px">' +
    '<div style="font:500 24px/32px var(--font);margin-bottom:8px">' + esc(l.title) + '</div>' +
    '<p style="font:400 14px/22px var(--font);color:var(--on-surface-variant);white-space:pre-wrap">' + esc(l.content_md || 'No description.') + '</p>' +
    (l.estimated_min ? '<div style="margin-top:8px;font:400 12px/16px var(--font);color:var(--on-surface-variant)">Duration: ~' + l.estimated_min + ' min</div>' : '') +
    '</div>' +
    (segHtml ? '<div style="font:500 16px/24px var(--font);margin-bottom:8px">Transcript</div>' + segHtml : '') +
    (qHtml ? '<div style="font:500 16px/24px var(--font);margin:16px 0 8px">Questions</div>' + qHtml : '') +
    '<button class="btn btn-fill mt-16" onclick="startSession(\'learn\')" style="width:100%">Start Learning</button>' +
    '</div>';
}

function closePanel() {
  document.getElementById('lessonPanel').classList.remove('show');
}

function closeMobileDrawer(e) {
  if (e.target === document.getElementById('mobileDrawer')) {
    document.getElementById('mobileDrawer').classList.remove('show');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.nv-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.nv-item[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'progress') {
    showDashboard();
  } else if (tab === 'queue') {
    showQueue();
  } else if (tab === 'learn') {
    if (!sessionId) {
      location.reload();
    }
  }
}

async function showDashboard() {
  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="loading"><div class="spinner">autorenew</div><p style="margin-top:12px">Loading dashboard...</p></div>';
  try {
    const r = await fetch(API + '/api/progress/1/dashboard?exam_id=' + (window.examId || 1));
    const d = await r.json();
    const o = d.overall || {};
    const acc = o.accuracy ? (o.accuracy * 100).toFixed(0) : '0';
    area.innerHTML = '<div class="card" style="text-align:center;padding:24px">' +
      '<div style="font:500 20px/28px var(--font);margin-bottom:16px">Your Progress</div>' +
      '<div class="r-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">' +
      '<div><div class="num">' + (o.total_questions || 0) + '</div><div class="lbl">Answered</div></div>' +
      '<div><div class="num">' + (o.total_correct || 0) + '</div><div class="lbl">Correct</div></div>' +
      '<div><div class="num" style="color:' + (parseInt(acc) >= 80 ? 'var(--success)' : parseInt(acc) >= 50 ? '#F9A825' : 'var(--error)') + '">' + acc + '%</div><div class="lbl">Accuracy</div></div>' +
      '<div><div class="num">' + (o.overall_streak || 0) + '</div><div class="lbl">Best streak</div></div>' +
      '</div></div>';

    // Domain breakdown
    if (d.domains && d.domains.length) {
      area.innerHTML += '<div class="card"><div style="font:500 16px/24px var(--font);margin-bottom:12px">By Domain</div>' +
        d.domains.map(dm => {
          const pct = dm.accuracy ? (dm.accuracy * 100).toFixed(0) : '0';
          const color = parseInt(pct) >= 80 ? 'var(--success)' : parseInt(pct) >= 50 ? '#F9A825' : 'var(--error)';
          return '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--outline-variant)">' +
            '<span style="flex:1;font:400 14px/20px var(--font)">' + esc(dm.name) + '</span>' +
            '<div style="width:80px;height:6px;background:var(--surface-variant);border-radius:3px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:3px"></div></div>' +
            '<span style="font:500 13px/18px var(--font);color:' + color + ';min-width:32px;text-align:right">' + pct + '%</span>' +
            '<span style="font:400 12px/16px var(--font);color:var(--on-surface-variant)">' + dm.answered + 'q</span></div>';
        }).join('') + '</div>';
    }

    // Need to review
    try {
      const cr = await fetch(API + '/api/progress/cards/due/1?exam_id=' + (window.examId || 1));
      const cards = await cr.json();
      if (cards.length) {
        area.innerHTML += '<div class="card"><div style="font:500 16px/24px var(--font);margin-bottom:8px">Due for Review</div>' +
          '<p style="font:400 14px/20px var(--font);color:var(--on-surface-variant);margin-bottom:12px">' + cards.length + ' cards need review.</p></div>';
      }
    } catch(e) {}

    area.innerHTML += '<button class="btn btn-outline" onclick="location.reload()" style="margin-top:4px">Back</button>';

  } catch(e) {
    area.innerHTML = '<div class="welcome"><div class="icon">error</div><h2>Could not load dashboard</h2></div>';
  }
}

async function showUploadForm() {
  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="card" style="max-width:500px;margin:0 auto">' +
    '<div style="font:500 18px/24px var(--font);margin-bottom:12px">Upload File</div>' +
    '<p style="font:400 14px/20px var(--font);color:var(--on-surface-variant);margin-bottom:16px">Upload a PDF or EPUB to create lessons from its content.</p>' +
    '<input type="file" id="pdfUpload" accept=".pdf,.epub" style="display:block;margin-bottom:12px;font:400 14px/20px var(--font)">' +
    '<div class="btn-group">' +
    '<button class="btn btn-fill" onclick="uploadPDF()">Process</button>' +
    '<button class="btn btn-text" onclick="location.reload()">Cancel</button>' +
    '</div>' +
    '<div id="uploadResult" style="margin-top:12px;font:400 13px/18px var(--font)"></div></div>';
}

async function uploadPDF() {
  const fileInput = document.getElementById('pdfUpload');
  const resultDiv = document.getElementById('uploadResult');
  if (!fileInput.files.length) { resultDiv.textContent = 'Please select a file.'; return; }
  const file = fileInput.files[0];
  
  var endpoint, code;
  if (file.name.endsWith('.pdf')) {
    endpoint = '/api/ingest/pdf';
    code = 'PDF-Content';
  } else if (file.name.endsWith('.epub')) {
    endpoint = '/api/ingest/epub';
    code = 'EPUB-Content';
  } else {
    resultDiv.textContent = 'Only PDF and EPUB files accepted.';
    return;
  }
  
  resultDiv.innerHTML = '<div style="display:flex;align-items:center;gap:8px"><div class="spinner" style="font-family:Material Symbols Outlined;animation:spin 1s linear infinite">autorenew</div> Processing ' + (file.size > 50 * 1024 * 1024 ? 'large file (may take a minute)...' : '...') + '</div>';
  const formData = new FormData();
  formData.append('file', file);
  formData.append('exam_code', code);
  
  try {
    const r = await fetch(endpoint, { method: 'POST', body: formData });
    const d = await r.json();
    if (d.status === 'ok') {
      resultDiv.innerHTML = '<span style="color:var(--success)">✅ Processed! ' + d.chapters + ' chapters, ' + d.key_points + ' key points, ' + d.lessons_created + ' lessons.</span>';
    } else {
      resultDiv.innerHTML = '<span style="color:var(--error)">❌ Error: ' + (d.detail || 'Unknown') + '</span>';
    }
  } catch(e) {
    resultDiv.innerHTML = '<span style="color:var(--error)">❌ Upload failed</span>';
  }
}

async function afterUpload() {
  try {
    const er = await fetch(API + '/api/exams');
    const exams = await er.json();
    if (exams && exams.length > 0) {
      var latest = exams[exams.length - 1];
      localStorage.setItem('ft-exam', String(latest.id));
    }
  } catch(e) {}
  localStorage.removeItem('ft-session');
  location.reload();
}

async function showQueue() {
  const area = document.getElementById('contentArea');
  try {
    const r = await fetch(API + '/api/progress/1/weak?exam_id=' + (window.examId || 1));
    const weak = await r.json();
    if (weak.length) {
      area.innerHTML = '<div class="card"><div style="font:500 16px/24px var(--font);margin-bottom:12px">Topics to Review</div>' +
        weak.map(w => '<div style="padding:8px 0;border-bottom:1px solid var(--outline-variant);font:400 14px/20px var(--font)">' +
          esc(w.description) + ' <span style="color:var(--error)">(' + (w.accuracy * 100).toFixed(0) + '%)</span></div>'
        ).join('') + '</div>';
    } else {
      area.innerHTML = '<div class="welcome"><div class="icon">check_circle</div><h2>Looking good!</h2><p>No weak topics to review.</p></div>';
    }
  } catch(e) {
    area.innerHTML = '<div class="welcome"><div class="icon">error</div><h2>Could not load queue</h2></div>';
  }
}

/* ════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════ */
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showError(msg) {
  document.getElementById('contentArea').innerHTML = `<div class="card" style="text-align:center;padding:32px"><div style="font:500 18px/24px var(--font);color:var(--error);margin-bottom:8px">Error</div><p>${esc(msg)}</p><button class="btn btn-fill mt-16" onclick="location.reload()">Reload</button></div>`;
}

/* ════════════════════════════════════════════════
   START
   ════════════════════════════════════════════════ */
init();
function switchMode(mode) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  var tab = document.querySelector('.mode-tab[data-mode="' + mode + '"]');
  if (tab) tab.classList.add('active');
  if (mode === 'progress') { showDashboard(); }
  else { startSession(mode); }
}

function filterLessons(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.lesson-item').forEach(function(item) {
    var t = item.textContent.toLowerCase();
    item.style.display = t.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.domain-group').forEach(function(g) {
    var items = g.querySelectorAll('.lesson-item');
    var visible = Array.from(items).some(function(it) { return it.style.display !== 'none'; });
    g.style.display = visible ? '' : 'none';
  });
}

function toggleGroup(header) {
  var arrow = header.querySelector('.arrow');
  var lessons = header.nextElementSibling;
  if (arrow) arrow.classList.toggle('open');
  if (lessons) lessons.classList.toggle('open');
}
</script>
